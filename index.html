<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightmare House 3D</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: fixed;
  inset: 0;
}

#hud {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
  text-shadow: 0 2px 5px #000;
  pointer-events: none;
}

#title {
  font-size: 22px;
  font-weight: bold;
  color: #d00;
}

#objective {
  margin-top: 8px;
  font-size: 15px;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  margin-top: -4px;
  border: 1px solid white;
  border-radius: 50%;
  z-index: 20;
  pointer-events: none;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 100;
  background:
    radial-gradient(circle at center, rgba(40,40,40,.15), rgba(0,0,0,.97));
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#startBox {
  max-width: 550px;
  padding: 35px;
}

h1 {
  color: #b40000;
  font-size: 48px;
  margin: 0 0 15px;
  text-shadow: 0 0 20px #700;
}

button {
  margin-top: 25px;
  padding: 14px 35px;
  background: #8d0000;
  color: white;
  border: 0;
  cursor: pointer;
  font-size: 18px;
  border-radius: 4px;
}

button:hover {
  background: #c00000;
}

#message {
  position: fixed;
  left: 50%;
  bottom: 15%;
  transform: translateX(-50%);
  z-index: 30;
  font-size: 22px;
  color: #fff;
  text-shadow: 0 0 10px #000;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
}

#jumpscare {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000;
  align-items: center;
  justify-content: center;
}

#monsterFace {
  font-size: 180px;
  color: #900;
  text-shadow:
    0 0 20px #f00,
    0 0 60px #600;
  animation: shake .05s infinite;
}

#win {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,.95);
  align-items: center;
  justify-content: center;
  text-align: center;
}

@keyframes shake {
  0% { transform: translate(4px, -3px) scale(1.1); }
  50% { transform: translate(-5px, 4px) scale(1.2); }
  100% { transform: translate(3px, 2px) scale(1.1); }
}

#danger {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  box-shadow: inset 0 0 0 rgba(255,0,0,0);
  transition: box-shadow .2s;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="title">NIGHTMARE HOUSE</div>
  <div id="objective">Kunci: 0 / 3</div>
</div>

<div id="crosshair"></div>
<div id="danger"></div>

<div id="message"></div>

<div id="start">
  <div id="startBox">
    <h1>NIGHTMARE</h1>
    <p>
      Kamu terbangun di sebuah rumah tua.<br>
      Ada sesuatu yang sedang memburumu.
    </p>

    <p>
      <b>W A S D</b> — Bergerak<br>
      <b>Mouse</b> — Melihat<br>
      <b>Shift</b> — Berlari<br>
      <b>F</b> — Senter<br>
      <b>E</b> — Mengambil kunci
    </p>

    <button id="startButton">MULAI</button>
  </div>
</div>

<div id="jumpscare">
  <div id="monsterFace">☠</div>
</div>

<div id="win">
  <div>
    <h1>SELAMAT</h1>
    <p>Kamu berhasil keluar dari rumah.</p>
    <button onclick="location.reload()">MAIN LAGI</button>
  </div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

/* =========================
   SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020204);
scene.fog = new THREE.FogExp2(0x050508, 0.035);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.7, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

const ambient = new THREE.HemisphereLight(
  0x303040,
  0x050505,
  0.25
);

scene.add(ambient);

/* SENTER */

const flashlight = new THREE.SpotLight(
  0xffffff,
  8,
  22,
  Math.PI / 8,
  0.45,
  1
);

flashlight.castShadow = true;
camera.add(flashlight);
camera.add(flashlight.target);

flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);

scene.add(camera);

/* =========================
   MATERIALS
========================= */

const floorMat = new THREE.MeshStandardMaterial({
  color: 0x171717,
  roughness: 1
});

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x252326,
  roughness: 1
});

const woodMat = new THREE.MeshStandardMaterial({
  color: 0x24130e,
  roughness: .9
});

const redMat = new THREE.MeshStandardMaterial({
  color: 0x4d0000,
  roughness: .8
});

/* =========================
   HOUSE
========================= */

function box(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  material
) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  const mesh = new THREE.Mesh(geo, material);

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;
}

/* lantai */

box(
  0,
  -0.15,
  0,
  40,
  .3,
  40,
  floorMat
);

/* dinding luar */

box(0, 3, -15, 30, 6, .5, wallMat);
box(0, 3, 15, 30, 6, .5, wallMat);
box(-15, 3, 0, .5, 6, 30, wallMat);
box(15, 3, 0, .5, 6, 30, wallMat);

/* dinding dalam */

box(-7, 3, -5, .4, 6, 10, wallMat);
box(7, 3, 5, .4, 6, 10, wallMat);

box(0, 3, -10, 14, 6, .4, wallMat);
box(0, 3, 10, 14, 6, .4, wallMat);

/* koridor */

box(-11, 3, 4, 7, 6, .4, wallMat);
box(11, 3, -4, 7, 6, .4, wallMat);

/* =========================
   PINTU KELUAR
========================= */

const exitDoor = box(
  0,
  2,
  -14.7,
  3,
  4,
  .3,
  woodMat
);

exitDoor.name = "exit";

/* lampu merah di atas pintu */

const redLight = new THREE.PointLight(
  0xff0000,
  2,
  8
);

redLight.position.set(0, 4.5, -14);
scene.add(redLight);

/* =========================
   LAMPU RUMAH
========================= */

function addLamp(x, y, z) {

  const light = new THREE.PointLight(
    0xffc080,
    1.5,
    7
  );

  light.position.set(x, y, z);

  scene.add(light);

  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(.12, 8, 8),
    new THREE.MeshBasicMaterial({
      color: 0xffaa55
    })
  );

  bulb.position.copy(light.position);

  scene.add(bulb);
}

addLamp(-10, 4.5, -8);
addLamp(10, 4.5, 8);
addLamp(-10, 4.5, 8);
addLamp(10, 4.5, -8);

/* =========================
   RANDOM FURNITURE
========================= */

box(-11, 1, -8, 3, 2, 1.5, woodMat);
box(10, 1, 7, 2, 2, 2, woodMat);
box(-10, 1, 7, 2, 2, 2, woodMat);
box(11, 1, -7, 2, 2, 2, woodMat);

/* =========================
   KEYS
========================= */

const keys = [];

function createKey(x, z) {

  const group = new THREE.Group();

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(.18, .05, 8, 16),
    new THREE.MeshStandardMaterial({
      color: 0xffd000,
      emissive: 0x553300
    })
  );

  ring.rotation.x = Math.PI / 2;

  const stem = new THREE.Mesh(
    new THREE.BoxGeometry(.08, .35, .08),
    ring.material
  );

  stem.position.y = -.18;

  group.add(ring);
  group.add(stem);

  group.position.set(x, .7, z);

  scene.add(group);

  keys.push({
    object: group,
    collected: false
  });
}

createKey(-11, -2);
createKey(11, 2);
createKey(0, 6);

/* =========================
   MONSTER
========================= */

const monster = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(.65, 1.7, 4, 8),
  new THREE.MeshStandardMaterial({
    color: 0x080808,
    roughness: 1
  })
);

body.position.y = 1.4;

monster.add(body);

/* kepala */

const head = new THREE.Mesh(
  new THREE.SphereGeometry(.65, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0x090909
  })
);

head.position.y = 2.7;

monster.add(head);

/* mata */

function eye(x) {

  const e = new THREE.Mesh(
    new THREE.SphereGeometry(.09, 8, 8),
    new THREE.MeshBasicMaterial({
      color: 0xff0000
    })
  );

  e.position.set(x, 2.8, -.58);

  monster.add(e);
}

eye(-.2);
eye(.2);

monster.position.set(
  10,
  0,
  -5
);

scene.add(monster);

/* =========================
   CONTROLS
========================= */

const controls = new PointerLockControls(
  camera,
  document.body
);

const startScreen = document.getElementById("start");
const startButton = document.getElementById("startButton");

startButton.addEventListener("click", () => {
  controls.lock();
});

controls.addEventListener("lock", () => {
  startScreen.style.display = "none";
});

controls.addEventListener("unlock", () => {
  if (!gameOver) {
    startScreen.style.display = "flex";
  }
});

/* =========================
   MOVEMENT
========================= */

const keysPressed = {};

document.addEventListener("keydown", e => {
  keysPressed[e.code] = true;

  if (e.code === "KeyF") {
    flashlight.visible = !flashlight.visible;
  }

  if (e.code === "KeyE") {
    collectNearbyKey();
  }
});

document.addEventListener("keyup", e => {
  keysPressed[e.code] = false;
});

/* =========================
   GAME STATE
========================= */

let collectedKeys = 0;
let gameOver = false;
let lastTime = performance.now();

const objective =
document.getElementById("objective");

const message =
document.getElementById("message");

const danger =
document.getElementById("danger");

/* =========================
   MESSAGE
========================= */

let messageTimer = null;

function showMessage(text) {

  message.textContent = text;
  message.style.opacity = 1;

  clearTimeout(messageTimer);

  messageTimer = setTimeout(() => {
    message.style.opacity = 0;
  }, 2500);
}

/* =========================
   COLLECT KEY
========================= */

function collectNearbyKey() {

  if (gameOver) return;

  for (const key of keys) {

    if (key.collected) continue;

    const distance =
      camera.position.distanceTo(
        key.object.position
      );

    if (distance < 2) {

      key.collected = true;

      scene.remove(key.object);

      collectedKeys++;

      objective.textContent =
        `Kunci: ${collectedKeys} / 3`;

      showMessage(
        "Kamu mendapatkan sebuah kunci..."
      );

      if (collectedKeys === 3) {
        showMessage(
          "Semua kunci terkumpul! Cari pintu keluar!"
        );
      }
    }
  }
}

/* =========================
   MONSTER AI
========================= */

function updateMonster(delta) {

  if (gameOver) return;

  const distance =
    monster.position.distanceTo(
      camera.position
    );

  /* monster mulai mengejar */

  if (distance < 14) {

    const direction = new THREE.Vector3();

    direction.subVectors(
      camera.position,
      monster.position
    );

    direction.y = 0;

    direction.normalize();

    let speed = 1.4;

    if (distance < 7) {
      speed = 2.7;
    }

    monster.position.addScaledVector(
      direction,
      speed * delta
    );

    monster.lookAt(
      camera.position.x,
      monster.position.y,
      camera.position.z
    );
  }

  /* efek bahaya */

  if (distance < 7) {

    const intensity =
      Math.max(0, 1 - distance / 7);

    danger.style.boxShadow =
      `inset 0 0 ${80 * intensity}px
       rgba(255,0,0,${intensity})`;
  } else {

    danger.style.boxShadow =
      "inset 0 0 0 rgba(255,0,0,0)";
  }

  /* tertangkap */

  if (distance < 1.4) {
    triggerJumpscare();
  }
}

/* =========================
   JUMPSCARE
========================= */

function triggerJumpscare() {

  if (gameOver) return;

  gameOver = true;

  controls.unlock();

  const scare =
    document.getElementById("jumpscare");

  scare.style.display = "flex";

  setTimeout(() => {
    location.reload();
  }, 2500);
}

/* =========================
   EXIT
========================= */

function checkExit() {

  if (collectedKeys < 3) return;

  const distance =
    camera.position.distanceTo(
      exitDoor.position
    );

  if (distance < 3) {

    gameOver = true;

    controls.unlock();

    document.getElementById("win")
      .style.display = "flex";
  }
}

/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(delta) {

  if (!controls.isLocked || gameOver)
    return;

  let speed =
    keysPressed["ShiftLeft"] ||
    keysPressed["ShiftRight"]
      ? 6
      : 3.5;

  if (keysPressed["KeyW"])
    controls.moveForward(speed * delta);

  if (keysPressed["KeyS"])
    controls.moveForward(-speed * delta);

  if (keysPressed["KeyA"])
    controls.moveRight(-speed * delta);

  if (keysPressed["KeyD"])
    controls.moveRight(speed * delta);

  /* batasi posisi */

  camera.position.x =
    THREE.MathUtils.clamp(
      camera.position.x,
      -13.5,
      13.5
    );

  camera.position.z =
    THREE.MathUtils.clamp(
      camera.position.z,
      -13.5,
      13.5
    );

  camera.position.y = 1.7;
}

/* =========================
   ANIMATE KEYS
========================= */

function animateKeys(time) {

  for (const key of keys) {

    if (!key.collected) {

      key.object.rotation.y =
        time * 0.002;

      key.object.position.y =
        .7 + Math.sin(time * .004) * .12;
    }
  }
}

/* =========================
   GAME LOOP
========================= */

function animate(time) {

  requestAnimationFrame(animate);

  const delta =
    Math.min(
      (time - lastTime) / 1000,
      .05
    );

  lastTime = time;

  updatePlayer(delta);
  updateMonster(delta);
  checkExit();
  animateKeys(time);

  renderer.render(scene, camera);
}

animate(performance.now());

/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
